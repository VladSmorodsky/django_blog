<div class="card mb-4 shadow-sm">
    <div class="card-body">
        <h5 class="card-title">
            <a href="{% url 'post_detail' post.slug %}" class="text-decoration-none text-primary">
                {{ post.title }}
            </a>
        </h5>
        <p class="card-text text-muted">
            {{ post.content|truncatewords:25|safe }}
        </p>
        <p>Tags: {{ post.tags.all|join:', ' }}</p>
        <div class="d-flex justify-content-between align-items-center">
            <small class="text-muted">Published on {{ post.published_at|date:"F j, Y" }}</small>
            <a href="{% url 'post_detail' post.slug %}" class="btn btn-sm btn-outline-primary">Read more</a>
        </div>
    </div>
</div>
